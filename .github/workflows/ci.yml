name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Avoid redundant runs on force-push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"
  # Matches the `unwind` panic policy in Cargo.toml release profile (A27).
  # Tests run debug by default; this env is informational.
  RUST_BACKTRACE: "1"

jobs:
  # ------------------------------------------------------------------
  # Build + test on stable Rust, Linux. Primary safety net.
  # ------------------------------------------------------------------
  test:
    name: Test (stable / ubuntu-latest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # No system libraries needed: mirage-client-gui uses Slint's software
      # renderer (pinned 1.9.2, pure-Rust font stack) — it links only the
      # standard C runtime, no GTK/fontconfig/GL.

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Verify workspace builds (debug)
        run: cargo build --locked --workspace --all-targets

      - name: Run full test suite
        run: cargo test --locked --workspace --all-targets

      - name: Run doctests
        run: cargo test --locked --workspace --doc

  # ------------------------------------------------------------------
  # Windows TUN (Wintun) build guard. The transparent-VPN device + routing
  # backends are platform-specific — Wintun (wintun-bindings) + netsh routing on
  # Windows vs /dev/net/tun + iproute2 on Linux — and TUN is ALWAYS compiled into
  # the client (no feature flag), so a Unix-green build does NOT prove the Windows
  # port compiles. This job keeps the Windows client build from silently
  # regressing. (Runtime validation of the Wintun adapter + route installation
  # needs a real Windows host with Administrator + wintun.dll and is out of CI
  # scope.)
  # ------------------------------------------------------------------
  windows-tun:
    name: Windows client build (Wintun TUN backend)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-tun-cargo-${{ hashFiles('Cargo.lock') }}
      - name: cargo check (client with the Wintun TUN backend)
        run: cargo check --locked -p mirage-client

  # ------------------------------------------------------------------
  # Reproducibility of committed test vectors.
  # Protects against silent drift in:
  # - discovery derivation test vectors (A13)
  # If these change unexpectedly, fail loudly.
  # ------------------------------------------------------------------
  vectors:
    name: Test vectors are stable
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Discovery + Nostr test vectors must pass unchanged
        run: cargo test --locked -p mirage-discovery --test vectors -- --nocapture

  # ------------------------------------------------------------------
  # Lint + format. Zero warnings allowed.
  # ------------------------------------------------------------------
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # No GTK/system libs: the GUI now renders via Slint's software backend.

      - name: Validate Actions workflows
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl -fsSLo "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint" -color .github/workflows/*.yml

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (all warnings = errors)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  # ------------------------------------------------------------------
  # Security audit of dependency tree.
  # Runs against the RustSec advisory database - any known CVE in a
  # dependency fails the job.
  # ------------------------------------------------------------------
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        # Pin to the last release that supports our MSRV (1.86); 0.22.2+ needs
        # rustc 1.88. Bump this together with the toolchain pin.
        run: cargo install --locked cargo-audit --version 0.22.1
      - name: Audit
        run: |
          ignore_ids=$(python3 -c 'import pathlib, tomllib; print(" ".join(tomllib.loads(pathlib.Path(".cargo/audit.toml").read_text())["advisories"]["ignore"]))')
          read -r -a advisory_ids <<< "$ignore_ids"
          args=()
          for id in "${advisory_ids[@]}"; do args+=(--ignore "$id"); done
          cargo audit --deny warnings "${args[@]}"

  # ------------------------------------------------------------------
  # Additional scan for unsafe outside the GUI and mobile FFI crates.
  # ------------------------------------------------------------------
  no_unsafe:
    name: No unsafe outside FFI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Grep for unsafe blocks in Mirage crates
        run: |
          # The GUI and mobile FFI crates use scoped unsafe for OS interfaces.
          if grep -rnE --include='*.rs' \
                '\bunsafe[[:space:]]*(\{|fn|impl|trait|extern)' crates/ \
              | grep -v 'crates/client-gui/' \
              | grep -v 'crates/mobile-ffi/' \
              | grep -v '#!\[forbid(unsafe_code)\]' \
              | grep -v '//.*unsafe' \
              | grep .; then
            echo "::error::Found unsafe usage in Mirage crate sources"
            exit 1
          fi
