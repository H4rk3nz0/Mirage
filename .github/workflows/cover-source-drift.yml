name: Cover source drift

# Check whether each regional pack still resolves browse and video sources
# from a GitHub runner. This cannot establish in-region reachability. For that,
# run `mirage-cover-record --sources <pack> --check-sources` in the region.

on:
  schedule:
    # 08:00 UTC every Monday.
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Browse and video sources still resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build the recorder
        run: cargo build --locked -p mirage-cover --bin mirage-cover-record

      - name: Probe every pack
        shell: bash
        run: |
          # `-e` OFF deliberately: collect every pack's result, then fail once
          # at the end. Keep the recorder's exit code; it signals exhaustion
          # of either browse or video, and also catches probe failures.
          set +e -uo pipefail
          BIN=target/debug/mirage-cover-record
          failed=""
          {
            echo "# Cover source drift"
            echo
            echo "Discovery only, from a GitHub runner. This does **not** test"
            echo "in-region reachability - see the workflow header."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          for pack in global ru ir cn tr; do
            echo "::group::$pack"
            # Never let one pack's network flakiness abort the loop.
            "$BIN" --sources "$pack" --check-sources --low-bitrate \
              > "out-$pack.txt" 2>&1
            probe_status=$?
            cat "out-$pack.txt"
            echo "::endgroup::"

            {
              echo "## \`$pack\`"
              echo
              echo '```'
              cat "out-$pack.txt"
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"

            # The recorder exits nonzero if either class is exhausted. Also
            # demand its final summary: a crash or a changed output format
            # must never produce a green drift check.
            if [ "$probe_status" -ne 0 ] || \
               ! grep -qE "^${pack}: [1-9][0-9]*/[1-9][0-9]* browse, [1-9][0-9]*/[1-9][0-9]* video sources resolved$" "out-$pack.txt"; then
              failed="$failed $pack"
              echo "::error title=Cover probe failed ($pack)::Probe exited $probe_status or did not produce a valid summary."
            fi
            # Surface partial rot as an annotation so it is visible without
            # opening the log.
            while read -r line; do
              echo "::warning title=Cover source failed ($pack)::$line"
            done < <(grep -F "FAIL" "out-$pack.txt" || true)
          done

          if [ -n "$failed" ]; then
            echo "::error title=Cover source drift::Failed packs:$failed. See each probe's output for browse/video exhaustion or probe errors."
            exit 1
          fi
          echo "All packs resolved their browse and video source classes."
