name: Pinned JA3 regression

# A26: verify that Mirage's committed ClientHello templates (Chrome /
# Firefox / Safari) still have their expected JA3 strings and do not collide.
# These tests use only in-tree constants. They cannot detect a real browser
# update or prove that any current browser has the same fingerprint. That
# requires fresh ClientHello captures and comparison against this source.
#
# The full suite already runs on every push in ci.yml. Keep this focused manual
# workflow for operators investigating a fingerprint mismatch.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  pinned_regression:
    name: Pinned JA3 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run the pinned JA3 tests
        run: |
          cargo test --locked -p mirage-transport-reality --lib tls_fingerprint:: -- --nocapture
