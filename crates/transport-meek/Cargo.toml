[package]
name = "mirage-transport-meek"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Meek (domain-fronted HTTP) transport for Mirage - CDN-proxied anti-censorship"

[dependencies]
mirage-common = { workspace = true }
mirage-crypto = { workspace = true }
mirage-discovery = { workspace = true }
mirage-transport = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
blake3 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Test-only: the envelope pacer lives in transport-reality, and pacing a carrier
# is a property both ends must agree on - one side framing and the other not
# HANGS rather than merely looking different. The podman harness cannot run meek
# (it needs CDN fronting), so a paced client-server pair here is the only place
# that property can actually be verified. No cycle: reality does not depend on meek.
mirage-transport-reality = { workspace = true }

[lints]
workspace = true
