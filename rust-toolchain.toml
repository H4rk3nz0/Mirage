# Workspace Rust toolchain.
#
# rustup reads this file for Cargo and rustc commands. The Nix flake uses the
# same toolchain file. Matching versions alone do not make builds bit-identical;
# target, flags, system libraries, and packaging inputs also matter.
#
# `channel = "1.86"` selects the latest 1.86 patch release. The workspace
# `rust-version` is the minimum supported compiler version.
#
# Bumping the pin:
# 1. Update `channel` below to the new stable release.
# 2. Also bump `rust-version` in the workspace Cargo.toml (MSRV).
# 3. Check that the Nix flake still uses this file.
# 4. Run `cargo test --workspace --all-targets` and CI.

[toolchain]
channel = "1.86"
components = ["rustfmt", "clippy"]
profile = "minimal"
